name: Update Node Count

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  count-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/quality/requirements-ci-cpu.txt

      - name: Install pinned CPU contract dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/quality/requirements-ci-cpu.txt

      - name: Validate published node behavior
        run: python -I scripts/quality/run_ci_contracts.py

      - name: Count Published LF Nodes
        id: count
        run: |
          set -e
          COUNT=$(python - <<'PY'
          from modules.workflow_runner.scripts.workflow_preflight import discover_lf_node_types
          print(len(discover_lf_node_types()))
          PY
          )

          echo "Discovered $COUNT published LF node mappings"
          echo "nodes=$COUNT" >> $GITHUB_OUTPUT
          echo "{ \"nodes\": $COUNT }" > count.json

      - name: (Optional) Verify Count with Python
        run: |
          python - <<'PY'
          import json
          from modules.workflow_runner.scripts.workflow_preflight import discover_lf_node_types

          mappings = discover_lf_node_types()
          print(f"Published LF node mapping count: {len(mappings)}")
          with open('count.json') as f:
              current = json.load(f).get('nodes')
          if current != len(mappings):
              raise SystemExit(
                  f"Mismatch between recorded count ({current}) and mapping count ({len(mappings)})"
              )
          PY

      - name: Create Pull Request with Node Count Update
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: '🤖 Auto-update node count: ${{ steps.count.outputs.nodes }} nodes'
          title: '🔢 Update node count to ${{ steps.count.outputs.nodes }}'
          body: |
            This PR automatically updates the count of published LF node mappings.
          branch: 'update-node-count/${{ github.run_id }}-${{ github.sha }}'
          # Labels are intentionally omitted to avoid potential permission issues.
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          add-paths: 'count.json'

      - name: Comment Node Count on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🔢 Published LF node count: **${{ steps.count.outputs.nodes }}**
            (Counts unique published `NODE_CLASS_MAPPINGS` keys)
