name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'pyproject.toml'

permissions:
  issues: write
  contents: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'lucafoscili' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/quality/requirements-ci-cpu.txt
      - name: Install pinned CPU contract dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/quality/requirements-ci-cpu.txt
      - name: Validate published node behavior
        run: python -I scripts/quality/run_ci_contracts.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked frontend dependencies
        run: corepack yarn install --immutable
      - name: Validate frontend, Titanic units, and production build
        run: corepack yarn check:release
      - name: Fetch all history and branches
        run: |
          # Only attempt to unshallow if this is a shallow clone. On a complete
          # repository `git fetch --unshallow` fails with exit code 128.
          # Use `git rev-parse --is-shallow-repository` which prints "true" or
          # "false" so we can guard the call.
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --unshallow
          fi
          # Always fetch all branches and tags to ensure history and tags exist
          # for later steps that compute tags/commits.
          git fetch --all --tags
      - name: Install TOML Parser
        run: pip install tomli
      - name: Extract Version from pyproject.toml
        id: extract_version
        run: |
          VERSION=$(python3 -c "import tomli; data = tomli.load(open('pyproject.toml', 'rb')); print(data['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Capture Release Commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check if Tag Exists
        id: check_tag
        run: |
          TAG_NAME="v${{ steps.extract_version.outputs.version }}"
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            TAG_SHA=$(git rev-list -n 1 "$TAG_NAME")
            RELEASE_SHA='${{ steps.release_commit.outputs.sha }}'
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Tag $TAG_NAME points to $TAG_SHA, expected $RELEASE_SHA" >&2
              exit 1
            fi
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Check if GitHub Release Exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.extract_version.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate Release Notes
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          python3 scripts/generate_release_notes.py \
            --repo . \
            --release-head '${{ steps.release_commit.outputs.sha }}' \
            --current-tag 'v${{ steps.extract_version.outputs.version }}' \
            --version '${{ steps.extract_version.outputs.version }}' \
            --output "$RUNNER_TEMP/github-release-notes.md"
      - name: Publish Custom Node
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: Comfy-Org/publish-node-action@v1
        with:
          ## Add your own personal access token to your Github Repository secrets and reference it here.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Create and Push Tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          TAG_NAME="v${{ steps.extract_version.outputs.version }}"
          git tag "$TAG_NAME" '${{ steps.release_commit.outputs.sha }}'
          git push origin "$TAG_NAME"
      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: v${{ steps.extract_version.outputs.version }}
          body_path: ${{ runner.temp }}/github-release-notes.md
          prerelease: false
          generate_release_notes: false
